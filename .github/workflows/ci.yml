name: Validacao local e contratos
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: uv run python scripts/security_audit.py
      - run: uv run cfn-lint infra/serverless.yaml
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run test:contract && npm run lint && npm run build
        working-directory: frontend
